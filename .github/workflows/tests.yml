name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,excel,plot]"
      - name: Test
        run: pytest
      - name: Walkthrough notebook (offline)
        run: pytest tests/test_notebook.py
      - name: Quickstart example (offline)
        run: python examples/quickstart.py --out "$RUNNER_TEMP/quickstart"
