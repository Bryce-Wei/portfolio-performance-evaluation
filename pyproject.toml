[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fundeval"
dynamic = ["version"]
description = "基金与投资组合绩效评估工具包，按《投资组合绩效评估》正文章节组织"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
data = ["akshare>=1.18.97"]
excel = ["openpyxl>=3.1"]
plot = ["matplotlib>=3.7"]
test = ["pytest>=7", "requests>=2.28"]  # requests 用于模拟 akshare 上游的网络异常

[project.scripts]
fundeval = "fundeval.cli:main"

[tool.setuptools.dynamic]
version = {attr = "fundeval._version.__version__"}  # 唯一来源：src/fundeval/_version.py

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m \"not network\""
markers = [
    "network: 需要访问 akshare 上游数据源的联网冒烟测试，默认跳过；用 pytest -m network 运行",
]
